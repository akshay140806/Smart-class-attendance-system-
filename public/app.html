<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Easwari Engineering College | Smart Classroom</title>
  <style>
    :root {
      --bg: #f2efe8;
      --panel: #fffdf8;
      --line: #d8cebf;
      --text: #1f1f1f;
      --staff: #0a3d62;
      --student: #1b5e20;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 10% 10%, rgba(10,61,98,0.16), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(27,94,32,0.16), transparent 35%),
        var(--bg);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      padding: 16px;
    }
    .card {
      width: min(900px, 96vw);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 24px rgba(18, 25, 21, 0.08);
    }
    h1 { margin: 0; text-align: center; font-size: clamp(1.4rem, 2.5vw, 2rem); }
    p { margin: 8px 0 20px; text-align: center; color: #5f594f; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn {
      border: none;
      color: #fff;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.02rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .staff { background: var(--staff); }
    .student { background: var(--student); }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Easwari Engineering College</h1>
    <p>Smart Classroom Attendance Portal</p>
    <div class="grid">
      <a class="btn staff" href="/login.html?role=staff">Staff</a>
      <a class="btn student" href="/login.html?role=student">Student</a>
    </div>
  </main>
</body>
</html>
